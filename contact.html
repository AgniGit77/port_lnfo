<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact • Agni Kumar Das</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;800;900&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">Agni Kumar Das <span class="animate" style="--i:1;"></span></a>
        <div class="bx bx-menu" id="menu-icon"><span class="animate" style="--i:2;"></span></div>
        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            
            <a href="experience.html">Experience</a>
            <a href="skills.html">Skills</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html" class="active">Contact</a>
            <span class="active-nav"></span>
            <span class="animate" style="--i:3;"></span>
        </nav>
    </header>

    <main>
        <section id="contact" class="contact show-animate">
            <h2 class="heading">Contact <span>Me</span> <span class="animate scroll" style="--i:1;"></span></h2>
            <form action="#" method="post">
                <div class="input-box">
                    <div class="input-field">
                        <input type="text" name="name" placeholder="Full Name" required>
                        <span class="focus"></span>
                    </div>
                    <div class="input-field">
                        <input type="email" name="email" placeholder="Email Address" required>
                        <span class="focus"></span>
                    </div>
                </div>
                <div class="textarea-field">
                    <textarea name="message" rows="6" placeholder="Your Message" required></textarea>
                    <span class="focus"></span>
                </div>
                <div class="btn-box btns">
                    <button type="submit" class="btn">Send</button>
                </div>
                <span class="animate scroll" style="--i:2;"></span>
            </form>
            <ul class="contact-list">
                <li>Email: <a href="mailto:hritik463@gmail.com">hritik463@gmail.com</a></li>
                <li>LinkedIn: <a href="https://www.linkedin.com/in/agni-das-5b5133291/" target="_blank" rel="noopener">linkedin.com/in/agni-das-5b5133291</a></li>
            </ul>
            <span class="animate scroll" style="--i:3;"></span>
        </section>
    </main>

    <footer class="footer show-animate">
        <div class="footer-text"><p>&copy; 2025 Agni Kumar Das. All rights reserved.</p></div>
        <div class="footer-iconTop"><a href="#contact" aria-label="Back to top"><i class='bx bx-up-arrow-alt'></i></a></div>
        <span class="animate scroll" style="--i:1;"></span>
    </footer>

    <script>
    const header = document.querySelector('.header');
    const menuIcon = document.getElementById('menu-icon');
    const navbar = document.querySelector('.navbar');
    menuIcon?.addEventListener('click', () => { navbar.classList.toggle('active'); menuIcon.classList.toggle('bx-x'); });
    window.addEventListener('scroll', () => {
        header.classList.toggle('sticky', window.scrollY > 50);
        document.querySelectorAll('section').forEach(sec => {
            const rect = sec.getBoundingClientRect();
            if (rect.top < window.innerHeight * 0.8) sec.classList.add('show-animate');
        });
        const footer = document.querySelector('.footer');
        if (footer) {
            const fRect = footer.getBoundingClientRect();
            if (fRect.top < window.innerHeight * 0.9) footer.classList.add('show-animate');
        }
    });
    </script>
</body>
</html>
